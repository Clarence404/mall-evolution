# PR 检查：格式、Checkstyle、ArchUnit、单元与集成测试，目标 10 分钟以内
on: pull_request
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      # 接口契约：冒烟测试导出的 openapi.json 与 PR 目标分支（通常是 main）上已合入的那一版比较，
      # 删字段、改类型等破坏性变更直接失败。基准取目标分支而不是 PR 自己的 api/openapi.json，PR 改了基线文件也绕不过去
      - name: OpenAPI breaking-change check
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          mkdir -p /tmp/oas-base
          if ! git show FETCH_HEAD:api/openapi.json > /tmp/oas-base/openapi.json; then
            echo "目标分支上还没有 api/openapi.json，跳过兼容检查"; exit 0
          fi
          docker run --rm -v /tmp/oas-base:/base -v "$PWD":/w tufin/oasdiff breaking \
            /base/openapi.json /w/mall-app/target/openapi.json --fail-on ERR
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2   # 密钥扫描，防止误提交
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Kubernetes 清单：kubeconform 按 API 版本的 JSON Schema 校验 deploy/k8s（CRD 用社区 schema 目录，没有的跳过）
  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubeconform
        run: |
          docker run --rm -v "$PWD":/w ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas \
            -ignore-filename-pattern 'kustomization\.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /w/deploy/k8s
  # Prometheus 规则与 Alertmanager 配置：promtool / amtool 语法与表达式检查
  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD":/w --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules /w/deploy/observability/prometheus/rules/components.yml /w/deploy/observability/prometheus/rules/place-order-slo.yml
      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD":/w --entrypoint amtool prom/alertmanager:v0.28.1 \
            check-config /w/deploy/observability/alertmanager/alertmanager.yml
