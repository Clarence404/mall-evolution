# PR 检查：格式、Checkstyle、ArchUnit、单元与集成测试，目标 10 分钟以内
on: pull_request
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2   # 密钥扫描，防止误提交
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
