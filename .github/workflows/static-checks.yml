# 可复用的静态检查（workflow_call）：pr.yml 与 verify.yml 都调用它，规则只写一份。不需要 JDK，只用 Docker 里的校验工具
name: static-checks
on:
  workflow_call:
jobs:
  # Kubernetes 清单：kubeconform 按 API 版本的 JSON Schema 校验 deploy/k8s（CRD 用社区 schema 目录，没有的跳过）
  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubeconform
        run: |
          docker run --rm -v "$PWD":/w ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas \
            -ignore-filename-pattern 'kustomization\.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /w/deploy/k8s
  # Prometheus 规则与 Alertmanager 配置：promtool / amtool 语法与表达式检查；本地抓取示例也一并校验
  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD":/w --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules /w/deploy/observability/prometheus/rules/components.yml /w/deploy/observability/prometheus/rules/place-order-slo.yml
      - name: promtool check config（本地抓取示例）
        run: |
          docker run --rm -v "$PWD":/w --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /w/deploy/observability/local/prometheus.yml
      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD":/w --entrypoint amtool prom/alertmanager:v0.28.1 \
            check-config /w/deploy/observability/alertmanager/alertmanager.yml
