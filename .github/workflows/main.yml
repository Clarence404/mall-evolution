# 合并到 main：重新构建 mall-app.jar，自动部署测试环境；生产部署手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy-prod:
        description: 部署到生产（逐台下线 → 替换 jar → 重启 → 健康检查 → 挂回）
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        with:
          name: mall-app
          path: mall-app/target/mall-app.jar
  deploy-test:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mall-app
      - run: bash deploy/deploy.sh mall-app.jar ${{ vars.TEST_HOSTS }}
  deploy-prod:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy-prod
    runs-on: ubuntu-latest
    environment: prod        # 生产环境在 GitHub 上配置人工审批
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mall-app
      - run: bash deploy/deploy.sh mall-app.jar ${{ vars.PROD_HOSTS }}
