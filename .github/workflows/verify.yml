# 完整验证并发布测试报告：main 与章节 / 阶段 tag 每次推送都跑 ./mvnw -B verify（集成测试不跳过）
# 报告发布到 gh-pages 分支的 reports/<ref>/，即 https://clarence404.github.io/mall-evolution/reports/<ref>/
name: verify
on:
  push:
    branches: [main]
    tags: ['ch*', 'stage-*']
  workflow_dispatch:
permissions:
  contents: write   # 推送 gh-pages 分支
concurrency:
  group: gh-pages-reports   # 串行发布，避免两个 ref 同时改 gh-pages 根目录
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # GitHub 托管的 runner 自带 Docker，Testcontainers 集成测试会真正执行
      - name: 构建与测试
        run: ./mvnw -B verify
      # 测试失败也照样出报告、发布，然后整个 job 仍然记为失败
      - name: 汇总测试报告
        if: ${{ !cancelled() }}
        run: |
          ./mvnw -B -ntp -q surefire-report:report-only surefire-report:failsafe-report-only -Daggregate=true || true
          bash .github/scripts/collect-reports.sh site "mall-evolution ${{ github.ref_name }}"
      - name: 发布报告到 reports/${{ github.ref_name }}
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          destination_dir: reports/${{ github.ref_name }}
          keep_files: true
      - name: 生成报告首页
        if: ${{ !cancelled() }}
        run: bash .github/scripts/pages-index.sh pages-root "${{ github.ref_name }}"
      - name: 发布报告首页
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages-root
          keep_files: true
  # Kubernetes 清单：kubeconform 按 API 版本的 JSON Schema 校验 deploy/k8s（CRD 用社区 schema 目录，没有的跳过）
  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubeconform
        run: |
          docker run --rm -v "$PWD":/w ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas \
            -ignore-filename-pattern 'kustomization\.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /w/deploy/k8s
