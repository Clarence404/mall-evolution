# 生产（Kubernetes）：数据库密码等密钥由 Secret 注入环境变量，不进 Nacos
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/mall_inventory
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:                      # 雪花机器号租约：与 mall-app 共用同一套 Sentinel（键带服务名，互不干扰）
      sentinel:
        master: mall-cache
        nodes: 10.0.1.21:26379,10.0.1.22:26379,10.0.1.11:26379
        password: ${REDIS_SENTINEL_PASSWORD}
      password: ${REDIS_PASSWORD}
      timeout: 200ms
  config:
    import:
      - optional:nacos:mall-common.yaml?group=COMMON_GROUP   # 各服务公共配置
      - nacos:inventory-service.yaml                         # 本服务配置，缺了启动失败
