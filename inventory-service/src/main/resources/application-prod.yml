# 生产（Kubernetes）：数据库密码等密钥由 Secret 注入环境变量，不进 Nacos
spring:
  flyway:
    enabled: false              # 迁移由 Argo CD 的 PreSync Job 用有 DDL 权限的账号执行，应用账号只有 DML 权限
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/mall_inventory
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:                      # 雪花机器号租约：与 mall-app 共用同一套 Sentinel（键带服务名，互不干扰）
      sentinel:
        master: mall-cache
        nodes: 10.0.1.21:26379,10.0.1.22:26379,10.0.1.11:26379
        password: ${REDIS_SENTINEL_PASSWORD}
      password: ${REDIS_PASSWORD}
      timeout: 200ms
  config:
    import:
      - optional:nacos:mall-common.yaml?group=COMMON_GROUP   # 各服务公共配置
      - nacos:inventory-service.yaml                         # 本服务配置，缺了启动失败

# 独立管理端口（业务端口 8080 + 10000）：Kubernetes 的存活 / 就绪 / 启动探针与 PodMonitor 都走这个端口（容器端口名 management），
# Prometheus 只从这里匿名抓 /actuator/prometheus，业务端口上它仍要登录（401）。管理端口不进 Service、不经网关
management:
  server:
    port: ${MANAGEMENT_PORT:18080}
