# 每个服务的 application.yml 只留连接信息，业务配置放 Nacos；密钥由 Kubernetes Secret 注入环境变量
spring:
  application:
    name: inventory-service                      # 即注册中心里的服务名
  profiles:
    default: dev
  task:
    scheduling:                 # 定时任务线程池：默认只有 1 个线程，所有 @Scheduled 排队执行——一个带远程调用的兜底任务卡住，
      pool:                     # 每秒一次的 outbox 中继和指标刷新就跟着停。给 4 个线程，周期任务互不阻塞
        size: 4
      thread-name-prefix: sched-
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 40                          # 压测第 2 轮：30 个连接不够，调到 40
      connection-timeout: 250                        # 池子耗尽时快速失败；HikariCP 允许的下限是 250ms
      transaction-isolation: TRANSACTION_READ_COMMITTED   # 换桶时条件不满足的 UPDATE 语句结束就释放行锁
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        register-enabled: false   # 关掉自动注册：预热完成、就绪后由 RegisterWhenReady 注册
        port: ${server.port}      # 端口本由自动注册从 Web 服务器启动事件里填，关掉自动注册后要显式给，否则注册成 -1
      config:
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
  http:
    serviceclient:
      mall-app:
        connect-timeout: 200ms
        read-timeout: 800ms

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5

server:
  port: 8080
  shutdown: graceful

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      slo:
        http.server.requests: 800ms      # 生成 le="0.8" 的桶，延迟 SLO 直接用它算
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mall:
  id:
    worker-id: ${WORKER_ID:}   # 雪花 ID 机器号：Kubernetes 里不配，由 Pod 启动时向 Redis 租（WorkerIdLease）；配了就用配置的
  security:
    jwt:
      secret: ${JWT_SECRET}
  inventory:
    reservation-ttl: 30m                   # 比订单支付超时多 15 分钟，留出关单消息延迟和重试的时间
    reservation-expire-interval: 5m        # 预占过期回查；大促期间在 Nacos 改为 1m
    bucket-rebalance-interval: 5s
  rocketmq:
    enabled: true
    endpoints: ${ROCKETMQ_ENDPOINTS:localhost:8081}
    access-key: ${ROCKETMQ_ACCESS_KEY:}
    secret-key: ${ROCKETMQ_SECRET_KEY:}
    consumption-threads: 8   # 每个消费组的消费线程数（客户端不设时是 20）：2 个消费组 × 8 = 16，不超过连接池（40）的一半
