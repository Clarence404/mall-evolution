# 本地：docker compose 起的 MySQL（mall_inventory 库）与 Nacos，只用本地开发的占位密码
spring:
  data:
    redis:                      # docker compose 起的单机 Redis；本地显式配了机器号，用不到租约
      host: ${MALL_REDIS_HOST:localhost}
      port: ${MALL_REDIS_PORT:6379}
      password: mall_dev
  datasource:
    url: jdbc:mysql://${MALL_DB_HOST:localhost}:${MALL_DB_PORT:3306}/mall_inventory?serverTimezone=Asia/Shanghai
    username: mall
    password: mall_dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  config:
    import:
      - optional:nacos:mall-common.yaml?group=COMMON_GROUP
      - optional:nacos:inventory-service.yaml      # 本地允许 Nacos 里还没有这份配置

server:
  port: 8082

mall:
  id:
    worker-id: 11   # 本地只有一个实例；与 mall-app（1）、payment-service（21）错开
  security:
    jwt:
      secret: dev-only-jwt-secret-change-me-0123456789   # 本地开发占位，非真实密钥

# 独立管理端口（业务端口 + 10000）：Prometheus 只从这里匿名抓 /actuator/prometheus，业务端口上它仍要登录（401）；
# 健康检查也随之挪到这个端口。管理端口只给同网段的监控访问，不经网关、不对外。用 MANAGEMENT_PORT 改端口
management:
  server:
    port: ${MANAGEMENT_PORT:18082}
