# 入口网关：只路由 /api/**；/internal/** 只在集群内可达，网关不路由它
# 路由、限流阈值线上以 Nacos 的 mall-gateway.yaml 为准（见 deploy/nacos），这里是同样的默认值
spring:
  application:
    name: mall-gateway
  profiles:
    default: dev
  data:
    redis:                                       # 限流用阶段二那套 Redis 8
      timeout: 200ms
      connect-timeout: 1s
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
      config:
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s                 # 由拆分时的 5s 收紧：超过 3s 用户早已离开或重试；不配 Retry 过滤器
          routes:
            - id: order-place                    # 下单单独一条路由，阈值比其他接口严
              uri: lb://mall-app
              order: 10
              predicates:
                - Path=/api/orders
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1     # 每个用户每秒 1 次
                    redis-rate-limiter.burstCapacity: 3     # 允许连点 3 次的突发
                    key-resolver: "#{@userRouteKeyResolver}"
            - id: payment-notify                 # 渠道回调：免 JWT、改验渠道签名，不挂用户限流
              uri: lb://payment-service
              order: 20
              predicates:
                - Path=/api/payments/notify/**
            - id: payment
              uri: lb://payment-service
              order: 30
              predicates:
                - Path=/api/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userRouteKeyResolver}"
            - id: anonymous                      # 商品详情、登录这类匿名可访问的接口走单独的路由，不挂用户限流
              uri: lb://mall-app
              order: 50
              predicates:
                - Path=/api/auth/**,/api/products/**
            - id: mall-app
              uri: lb://mall-app
              order: 100                         # 兜底路由放最后
              predicates:
                - Path=/api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20    # 每个用户每秒 20 次、突发 40
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userRouteKeyResolver}"

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

mall:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: mall-evolution
