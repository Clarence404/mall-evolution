# 实验 K 各变体共用：压测参数（传给 LocateSimulation）与脚本开关
[experiment]
# 只读流量、固定速率：订单列表 1000 次/秒、订单详情 1000 次/秒，不下单——写入多的时候虚拟机上的 MySQL 仍会零星卡顿，
# 会把尾部耗时弄脏；只读时尾部的差别才主要来自 JVM。先预热 60 秒，再正式压 240 秒。
# 压测直接打 mall-app 的端口、不经网关：被测的只有 mall-app 的 JVM，经网关的话一次查询里网关那一跳比 mall-app 自己还久，会把差别盖住
ha.baseUrl=http://localhost:8080
ha.orderRps=0
ha.listRps=1000
ha.detailRps=1000
ha.warmupSec=60
ha.durationSec=240
ha.timeoutMs=5000

[script]
# mall-app 绑在 4 个逻辑 CPU 上（见 HaExperiment.psm1 的 Start-HaTopology），相当于一个 4 核的容器：
# 开发机有 28 个逻辑 CPU，不限制的话并发回收的线程永远有空闲的核可用，看不出它和业务线程抢 CPU
mallAppCpus=4
# mall-app 用哪个 JDK：21（和其他服务一样）或 25（要设环境变量 MALL_JAVA25_HOME，或给 run.ps1 传 -Java25Home）
mallAppJdk=21

[mall-app]
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
server.tomcat.threads.max=200

[mall-gateway]
spring.cloud.gateway.server.webflux.httpclient.response-timeout=3s

# 被测的只有 mall-app 的 JVM 参数，各变体覆盖这一行；GC 日志写到本轮结果目录
[jvm]
mall-app=-Xms1g -Xmx1g -XX:ActiveProcessorCount=4 -XX:+UseG1GC -Xlog:gc*,safepoint:file={run}/gc-{name}.log:time,uptime,level,tags
