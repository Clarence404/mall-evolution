# 实验 A 各变体共用：压测参数（传给 SlowDownstreamSimulation）
[experiment]
ha.orderRps=40
ha.detailRps=100
ha.durationSec=360
ha.faultAtSec=60
ha.faultSec=180
ha.faultDelayMs=5000
ha.timeoutMs=10000

[script]
# 注入后第几秒抓 mall-app 与库存服务的线程栈（相对压测开始），逗号分隔
threadDumpAtSec=90,150

# 正式配置的值显式写一遍：万一共用的 Nacos 里有同名配置，也以这里为准（命令行参数优先级最高）
[mall-app]
spring.http.serviceclient.inventory-service.connect-timeout=200ms
spring.http.serviceclient.inventory-service.read-timeout=500ms
resilience4j.bulkhead.instances.inventory-reserve.max-concurrent-calls=60
resilience4j.bulkhead.instances.inventory-reserve.max-wait-duration=0
# 修复前的值：实验暴露问题之后，application.yml 把连接池放开到每个下游实例 100 条、熔断器忽略舱壁满的异常。
# A0–A4 要复现的是修复前的行为，所以把当时的值钉在这里（HttpClient 5 的默认连接池；熔断器不忽略任何异常）。修复后的正式配置见 a5-fixed
mall.http-client.max-connections-per-route=5
mall.http-client.max-connections-total=25
mall.http-client.connection-request-timeout=3m
resilience4j.circuitbreaker.instances.inventory-reserve.ignore-exceptions=
resilience4j.circuitbreaker.instances.inventory-stock-query.ignore-exceptions=

[mall-gateway]
spring.cloud.gateway.server.webflux.httpclient.response-timeout=3s
