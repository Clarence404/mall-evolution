# A4（视 A3 的结果决定跑不跑）：正式配置 + 服务间 HTTP 连接池开关。
# 背景：RestClient 底层是随 nacos-client 引进来的 HttpClient 5，默认每个目标只有 5 条连接、取连接最多等 3 分钟，
# 读超时管不到「等连接」这一段（mall-common 的 HttpClientPoolConfigTest 记录了这个行为）。
# A3 里如果线程栈显示大量线程卡在 PoolingHttpClientConnectionManager / StrictConnPool，就跑这一组。
[mall-app]
# 每个目标的连接数 ≥ 下单舱壁 60 + 详情库存查询舱壁 20
mall.http-client.max-connections-per-route=100
mall.http-client.max-connections-total=200
# 池子满了 100ms 内拿不到连接就失败，不再排队等 3 分钟
mall.http-client.connection-request-timeout=100ms
