# A0 对照组：没有超时、没有舱壁、没有熔断（库存服务变慢时 mall-app 毫无防备）
[mall-app]
# 读超时 60 秒，等于没有
spring.http.serviceclient.inventory-service.read-timeout=60s
# 舱壁许可 10000，等于没有
resilience4j.bulkhead.instances.inventory-reserve.max-concurrent-calls=10000
# 至少 1 亿次调用才开始统计失败率，等于没有熔断
resilience4j.circuitbreaker.instances.inventory-reserve.minimum-number-of-calls=100000000

[mall-gateway]
# 网关的 3 秒响应超时也拿掉，后端本身的表现才看得清（客户端 10 秒超时兜底）
spring.cloud.gateway.server.webflux.httpclient.response-timeout=60s
