# B1 对照组：不受控的重试
#   App：失败立刻重试，最多 3 次，不等待、不看 Retry-After、不设预算
#   mall-app：支付查询超时后立刻重试 3 次（正式值是 1 次、随机退避 20–80ms），关掉熔断和舱壁
# 一次用户请求最多变成 4 × 4 = 16 次对支付服务的调用
[mall-app]
mall.remote.payment-query.retry.max-retries=3
mall.remote.payment-query.retry.delay=0ms
mall.remote.payment-query.retry.jitter=0ms
resilience4j.circuitbreaker.instances.payment-query.minimum-number-of-calls=100000000
resilience4j.bulkhead.instances.payment-query.max-concurrent-calls=10000

[experiment]
ha.retry.mode=immediate
ha.retry.max=3
