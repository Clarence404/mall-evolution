# 实验 B 各变体共用
[mall-app]
# 正式配置的值显式写一遍（mall-app → 支付查询），共用 Nacos 里有同名配置也以这里为准
spring.http.serviceclient.payment-service.connect-timeout=200ms
spring.http.serviceclient.payment-service.read-timeout=500ms
# 服务间连接池放开（见实验 A 的 A4）：HttpClient 5 默认每个目标只有 5 条连接，会先于「支付查询的容量」成为瓶颈，
# 那样看到的就不是重试本身的效果了。各组都一样放开
mall.http-client.max-connections-per-route=500
mall.http-client.max-connections-total=1000
mall.http-client.connection-request-timeout=200ms
# 修复前的值：熔断器当时不忽略舱壁满的异常（B1 的受控组里熔断器因此没有打开）。要复现文章里的数字就保持为空
resilience4j.circuitbreaker.instances.payment-query.ignore-exceptions=

[experiment]
# B1（重试风暴）的压测参数；B2 的场景不读这些
ha.prepareUsers=600
ha.prepareRps=50
ha.pollRps=150
ha.durationSec=300
ha.capConcurrent=10
ha.capServiceMs=40
ha.hiccupServiceMs=400
ha.hiccupAtSec=60
ha.hiccupSec=20
ha.timeoutMs=2000
