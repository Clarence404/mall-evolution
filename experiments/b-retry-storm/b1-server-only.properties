# B1 归因用（可选）：只把 mall-app 改成正式配置（重试 1 次 + 抖动、熔断、舱壁），App 仍然失败立刻重试 3 次
[mall-app]
mall.remote.payment-query.retry.max-retries=1
mall.remote.payment-query.retry.delay=20ms
mall.remote.payment-query.retry.jitter=60ms
resilience4j.circuitbreaker.instances.payment-query.sliding-window-type=TIME_BASED
resilience4j.circuitbreaker.instances.payment-query.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment-query.minimum-number-of-calls=50
resilience4j.circuitbreaker.instances.payment-query.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment-query.wait-duration-in-open-state=10s
resilience4j.bulkhead.instances.payment-query.max-concurrent-calls=20

[experiment]
ha.retry.mode=immediate
ha.retry.max=3
