# 实验 H 各变体共用：压测参数（传给 PoolSizingSimulation）与脚本开关
[experiment]
# 闭环：200 个虚拟用户不加思考时间循环，先预热 30 秒（请求名带「(预热)」，不计数），再正式压 5 分钟；每一圈 5% 下单、95% 查订单列表（下单占比再高，库存服务的 40 条连接会先成为瓶颈，看到的就不是 mall-app 的连接池了）
ha.users=200
ha.warmupSec=30
ha.durationSec=300
ha.orderWeight=5
ha.timeoutMs=5000

[script]
# 起几个 mall-app 实例（8080、8180、8280……），都挂在同一个网关后面
mallAppCount=1
# 压测前把 20001–20003 各补到多少件：闭环压测的单数由吞吐决定，事先说不准，多备一些
restockTarget=300000
# 压测开始后第几秒（含预热的 30 秒）抓各 mall-app 实例的线程栈，逗号分隔；到点时压测已经结束就不抓
threadDumpAtSec=180
# 压测结束后最多等多少秒，让实验订单关完、库存还回来，免得积压的关单带进下一轮；连续 drainIdleSec 秒库存不再变化就不等了。0 表示不等
drainWaitSec=900
drainIdleSec=120

# 正式配置的值显式写一遍（mall-app 的连接池 20、取连接最多等 3 秒；Tomcat 最多 200 个线程是 Spring Boot 的默认值）：
# 万一共用的 Nacos 里有同名配置，也以这里为准。各变体只改其中一项
[mall-app]
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
server.tomcat.threads.max=200

[inventory-service]
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.connection-timeout=250

[mall-gateway]
spring.cloud.gateway.server.webflux.httpclient.response-timeout=3s
