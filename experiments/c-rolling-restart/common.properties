# 实验 C 各变体共用：网关后面 3 个 mall-app 实例（8080 / 8180 / 8280），压测期间逐个重启
[experiment]
ha.detailRps=60
ha.orderRps=10
ha.listRps=10
ha.durationSec=600
ha.timeoutMs=5000

[script]
# 压测开始后第几秒重启第一个实例；两次重启之间隔多久（让每次重启的影响在时间轴上分得开）
firstRestartAtSec=60
gapSec=60
# 新实例起来后等什么再重启下一个：readiness（就绪探针通过）或 port（端口开始监听就算，相当于没配就绪探针）
waitFor=readiness
# 先注销再停时，注销后等几秒再发 SIGTERM（Kubernetes 清单里 preStop 的 sleep 15）
offlineWaitSec=15

[mall-gateway]
# 正式值显式写一遍：网关 LoadBalancer 的实例列表缓存（Spring Cloud LoadBalancer 默认 35 秒）
spring.cloud.loadbalancer.cache.ttl=35s
