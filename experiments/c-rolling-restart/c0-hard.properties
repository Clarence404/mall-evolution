# C0 对照组：没有优雅停机、没有就绪门槛
#   停：直接发 SIGTERM，server.shutdown=immediate（在途请求当场断开），不先从 Nacos 注销
#   起：Web 服务器一启动就注册到 Nacos（不等预热和就绪），端口一监听就去重启下一个
[mall-app]
# 修复前的行为：停机时不由 RegisterWhenReady 主动注销（修复后默认会注销，见 c5-fixed）
mall.lifecycle.deregister-on-shutdown=false
server.shutdown=immediate
spring.cloud.nacos.discovery.register-enabled=true

[script]
restartMode=sigterm
waitFor=port
