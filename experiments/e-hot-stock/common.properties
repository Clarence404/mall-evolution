# 实验 E 各变体共用：压测参数（传给 HotStockSimulation）与脚本开关。四个变体只差 [script] 的 buckets
[experiment]
# 预热：服务刚起来时头几秒的请求很慢，足以把下单的熔断器打开；先以 20 单/秒跑 30 秒，这一段的请求名带「(预热)」，不计入各级
ha.warmupSec=30
ha.warmupRps=20
# stair：下单速率从 50/s 起，每 90 秒加 50，加到 450/s，共 9 级 13.5 分钟、20.25 万单
ha.mode=stair
ha.startRps=50
ha.stepRps=50
ha.stepSec=90
ha.maxRps=450
# steady 模式才用到（-Set "experiment:ha.mode=steady"）：固定速率压一段，确认拐点两侧能不能长时间稳住
ha.orderRps=200
ha.durationSec=300
ha.timeoutMs=3000

[script]
# 热点 SKU：所有下单都打它
hotSku=20001
# 把热点 SKU 拆成几个桶；0 表示不拆（单行扣减）。压测开始前拆，结束后并回去
buckets=0
# 压测前把热点 SKU 补到多少件：要大于这一轮的总单数（默认阶梯 21.6 万单），不指望关单及时把库存还回来。上限 100 万
restockTarget=300000
# 压测结束后最多等多少秒，让实验订单关完、库存还回来（分桶的 SKU 还有未释放的预占时并不回去）；连续 drainIdleSec 秒库存不再变化就不等了
drainWaitSec=1800
drainIdleSec=120
# 库存回来（或不再变化、脚本已把卡住的预占释放掉）之后，最多再花多少秒反复尝试合并
mergeWaitSec=120
# 压测开始后第几秒（含预热的 30 秒）抓 mall-app 与库存服务的线程栈，逗号分隔；默认落在第 3 级（150/s，已过单行的拐点）和第 8 级（400/s）的中间。
# 到点时压测已经结束就不抓
threadDumpAtSec=255,705

# 正式配置的值显式写一遍：万一共用的 Nacos 里有同名配置，也以这里为准（命令行参数优先级最高）。
# 本实验不改任何保护手段：过了拐点，多出来的下单会被舱壁（503）、熔断（503）或网关超时（504）挡掉，拐点按「每秒成功单数不再跟着涨」判定
[mall-app]
spring.http.serviceclient.inventory-service.connect-timeout=200ms
spring.http.serviceclient.inventory-service.read-timeout=500ms
resilience4j.bulkhead.instances.inventory-reserve.max-concurrent-calls=60
resilience4j.bulkhead.instances.inventory-reserve.max-wait-duration=0
spring.datasource.hikari.maximum-pool-size=20

[inventory-service]
# 持锁时间模型：预占扣完库存后在事务里多停留 10ms（行锁不放），单行的容量约 100 单/秒，n 个桶约 n 倍。
# 开发机上真实的持锁时间太短，压不到单行的拐点；这是模型，文章里要写明。设为 0 即关掉
mall.demo.reserve-hold-ms=10
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.connection-timeout=250

[mall-gateway]
spring.cloud.gateway.server.webflux.httpclient.response-timeout=3s
