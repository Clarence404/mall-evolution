# 实验 G 各变体共用：压测参数（传给 AsyncPeakSimulation）与脚本开关。各变体只改 [inventory-service] 的消费延迟与消费线程数
[experiment]
# 预热：以平时的速率（20 单/秒）跑 30 秒，这一段的请求名带「(预热)」
ha.warmupSec=30
ha.warmupRps=20
# 平时 20 单/秒；第 60 秒起升到 60 单/秒、持续 60 秒，再回到 20 单/秒，直到第 360 秒（都不含预热）。约 9600 单，加预热 10200 单
ha.baseRps=20
ha.burstRps=60
ha.burstAtSec=60
ha.burstSec=60
ha.durationSec=360
# 未支付多久关单：demo 环境是 60 秒（下面 [mall-app] 里显式写了一遍）。场景只用它在 events.csv 里标出「关单高峰」预计的起止时刻
ha.payTimeoutSec=60
# 压测流量结束后场景再空等多久：最后一批订单 60 秒后才关单，消费慢的那几组还有积压要消化，这段时间逐秒采样一直在记
ha.drainSec=240
ha.timeoutMs=3000

[script]
# 压测前把 20001–20003 各补到多少件（一轮约 1 万单）
restockTarget=100000
# 压测开始后第几秒（含预热的 30 秒）抓库存服务的线程栈，逗号分隔；默认落在关单高峰的中间（30 + 60 + 60 + 30）。留空表示不抓
threadDumpAtSec=180
# 压测开始前最多等多少秒，让上一轮留在 Broker 里的消息先消费完（消费计数连续 10 秒不变就算完），免得算进这一轮的消费延迟
settleWaitSec=180
# 压测结束后最多等多少秒，让实验订单关完、库存还回来；连续 drainIdleSec 秒库存不再变化就不等了。0 表示不等
drainWaitSec=900
drainIdleSec=120

[all]
# 本地消息表的两个指标（最老待发送记录等了多久、失败条数）默认 15 秒刷新一次，实验里改成 1 秒，逐秒采样才看得到变化
mall.outbox.metrics-interval=1s
# 消费延迟的直方图桶：Prometheus 用它算 P50 / P99，逐秒采样也留着这些桶。不配的话只有次数、总和与最大值
management.metrics.distribution.slo.mq.consume.delay=25ms,50ms,100ms,150ms,200ms,300ms,500ms,750ms,1s,1500ms,2s,3s,5s,7500ms,10s,15s,20s,30s,45s,60s,90s,120s,180s,300s

# 正式配置的值显式写一遍：万一共用的 Nacos 里有同名配置，也以这里为准（命令行参数优先级最高）
[mall-app]
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
# mall-app 的 5 个消费组各 2 个线程（正式配置），其中 order-timeout-consumer 负责关单
mall.rocketmq.consumption-threads=2
# demo 的节奏：下单 1 分钟未支付即关单（正式环境 15 分钟）
mall.promo.normal-pay-timeout=1m
mall.promo.activity-pay-timeout=1m

[inventory-service]
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.connection-timeout=250
# 库存服务的 2 个消费组各 8 个线程（正式配置）；g1–g3 改它
mall.rocketmq.consumption-threads=8
# 消费延迟模型：处理每条消息前多停留的毫秒数，0 即不停（g0）。只对释放预占的消费组生效。这是模型，文章里要写明
mall.demo.consume-delay-ms=0
mall.demo.consume-delay-groups=inventory-release-consumer

[mall-gateway]
spring.cloud.gateway.server.webflux.httpclient.response-timeout=3s
