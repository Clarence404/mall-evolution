# 实验 I 各变体共用：压测参数（传给 LocateSimulation）与脚本开关
[experiment]
# 开放模型、固定速率：下单 50 单/秒、订单列表 200 次/秒、订单详情 100 次/秒，先预热 60 秒，再正式压 240 秒。
# 这个负载离任何一处的上限都很远（高并发的实验里下单能到 400 单/秒、查询能到 2700 次/秒），请求不排队，量到的就是一次请求本身要多久。
# 试过翻一倍（100 / 300 / 200）：放 MySQL 的那台 4 核虚拟机 CPU 到 70%，已经不算「远没压满」
ha.orderRps=50
ha.listRps=200
ha.detailRps=100
ha.warmupSec=60
ha.durationSec=240
ha.timeoutMs=5000
# 两种查询在全部 4000 个种子用户里随机挑（每人 200 单，只查最近的 20 单）：和线上一样，来查的是很多个不同的用户
ha.seedUsers=4000

[script]
# 要看的那一段：压测开始后第几秒（含预热的 60 秒）起、多长。JFR 从流量进来之前就开着，到点只取这一段；MySQL 的语句统计在这一段开头清零、
# 结尾取回。jfrAtSec=0 表示这一轮不录
jfrAtSec=80
jfrSec=210
# JFR 记不记每一次网络读写（等 MySQL、等下游各多久靠它）。默认不记：记的话每秒上万个事件，方法采样的产出只剩三分之一
# （试跑里同样 60 秒，不记是 1298 个采样，记是 450 个上下）。要看网络等待的那几轮用 i2-sockets
jfrSocketEvents=false
# 四个服务用哪个 JDK：21 或 25（25 要设环境变量 MALL_JAVA25_HOME，或给 run.ps1 传 -Java25Home）
servicesJdk=21
# 压测前把 20001–20003 各补到多少件
restockTarget=300000
# 压测结束后最多等多少秒，让实验订单关完、库存还回来；连续 drainIdleSec 秒库存不再变化就不等了。0 表示不等
drainWaitSec=600
drainIdleSec=120

# MySQL 驱动的连接属性：正式配置里已经打开了 useLocalSessionState 与 cachePrepStmts（就是这个实验的 i3 量出来的），
# 这里显式关掉，i1、i2、i4、i0 量的仍是驱动默认值下的样子；i3 再打开
[all]
spring.datasource.hikari.data-source-properties.useLocalSessionState=false
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
# 正式配置的值显式写一遍：万一共用的 Nacos 里有同名配置，也以这里为准
[mall-app]
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
server.tomcat.threads.max=200

[inventory-service]
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.connection-timeout=250

[mall-gateway]
spring.cloud.gateway.server.webflux.httpclient.response-timeout=3s

# 各服务的 JVM 参数。实验一直用的是 512MB 起步、最大 1GB 的堆，收集器是这台 20 核机器上的默认值 G1
[jvm]
mall-app=-Xms512m -Xmx1g
inventory-service=-Xms512m -Xmx1g
mall-gateway=-Xms512m -Xmx1g
