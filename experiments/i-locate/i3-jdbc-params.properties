# I3：在 I2 的基础上给 MySQL 驱动加三个连接属性（经 HikariCP 传给 Connector/J，不改代码）：
#   useLocalSessionState=true  驱动记着自己设过的 autocommit、只读、隔离级别，不再每次去问服务端（省掉 SELECT @@SESSION.transaction_read_only 这类往返）
#   cachePrepStmts=true        缓存预编译语句的解析结果，同一条 SQL 不用每次执行都重新找一遍占位符
#   prepStmtCacheSize / prepStmtCacheSqlLimit  缓存多少条、多长以内的 SQL（默认 25 条、256 个字符，订单的几条语句都超长）
[all]
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

[mall-app]
mall.demo.order-list.index-hint=true
