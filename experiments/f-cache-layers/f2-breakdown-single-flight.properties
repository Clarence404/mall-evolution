# F2：击穿，有单飞（正式的做法）——热点 SKU 的缓存每 20 秒失效一次，同时未命中的请求里只有一个去回源，其余等它的结果。
# 和 f2-breakdown-no-single-flight 只差 single-flight-enabled 这一项。两组都关掉 Redis、回源都按 200ms 的慢查询算，理由见 README「实验 F」
[experiment]
ha.mode=breakdown
ha.detailRps=300

[script]
threadDumpAtSec=

[mall-app]
mall.demo.detail-cache.single-flight-enabled=true
mall.demo.detail-cache.l2-enabled=false
mall.demo.detail-cache.load-delay-ms=200
