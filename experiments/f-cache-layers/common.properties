# 实验 F 各变体共用：压测参数（传给 CacheLayersSimulation）与脚本开关。各变体只改 [mall-app] 里的缓存开关和 [experiment] 的模式
[experiment]
# 预热：服务刚起来时头几秒的请求很慢；先以 50 次/秒跑 30 秒，这一段的请求名带「(预热)」，不计入各级。预热只请求存在的 SKU
ha.warmupSec=30
ha.warmupRps=50
# stair（F1 用）：详情请求从 200/s 起，每 60 秒加 200，加到 1600/s，共 8 级 8 分钟；80% 的请求给最热的 SKU（ha.skus 的第一个），其余平均分
ha.mode=stair
ha.hotShare=0.8
ha.startRps=200
ha.stepRps=200
ha.stepSec=60
ha.maxRps=1600
# breakdown（F2）、penetration（F3）用：固定速率压 180 秒；速率 ha.detailRps 写在各变体文件里（击穿 300/s，穿透 200/s）
ha.durationSec=180
# breakdown：每隔 20 秒让热点 SKU 的两级缓存失效一次（要小于本机缓存的 30 秒有效期，否则中间还会自然过期一次）
ha.expireEverySec=20
ha.timeoutMs=3000

[script]
# 压测开始后第几秒（含预热的 30 秒）抓 mall-app 的线程栈，逗号分隔；默认落在第 4 级（800/s）和第 8 级（1600/s）的中间。
# 到点时压测已经结束就不抓；留空表示不抓（F2、F3 的变体文件里留空）
threadDumpAtSec=240,480

# 正式配置的值显式写一遍：万一共用的 Nacos 里有同名配置，也以这里为准（命令行参数优先级最高）
[mall-app]
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
server.tomcat.threads.max=200
# 本机缓存的失效广播：击穿实验靠它让本机缓存失效，必须开着（默认就是开）
mall.cache.l1-invalidation-enabled=true
# 商品详情缓存的演示开关：这里都是默认值（和正式环境一样），各变体只改其中一两项
mall.demo.detail-cache.l1-enabled=true
mall.demo.detail-cache.l2-enabled=true
mall.demo.detail-cache.single-flight-enabled=true
mall.demo.detail-cache.null-cache-enabled=true
mall.demo.detail-cache.load-delay-ms=0

[mall-gateway]
spring.cloud.gateway.server.webflux.httpclient.response-timeout=3s
