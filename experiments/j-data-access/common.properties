# 实验 J 各变体共用：压测参数（传给 DataAccessSimulation）。请求直接打 mall-app 的 /internal/demo/perf/**，不经网关
[experiment]
ha.appUrl=http://localhost:8080
ha.timeoutMs=60000

# 正式配置的值显式写一遍；另外把 MyBatis 的语句超时从 5 秒放到 60 秒——深分页最深的一档单条查询就可能超过 5 秒，要量的正是它到底多慢
[mall-app]
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
server.tomcat.threads.max=200
mybatis.configuration.default-statement-timeout=60

[jvm]
mall-app=-Xms512m -Xmx1g
