# 实验 D 各变体共用
[experiment]
# 容量模型：给 mall-app 的全部 /api/** 请求加一个统一的处理能力上限——并发 10、每个请求占用 20ms，约 500 次/秒。
# 下单和浏览共用这份容量，就像共用 CPU 和线程池；这样结果不受本机 CPU 和压测机自身开销影响，换台机器也能复现。
# 想测本机真实容量就设成 0（见 d0-probe-real）
ha.appCapConcurrent=10
ha.appCapServiceMs=20
ha.orderRps=20
ha.timeoutMs=3000
# burst 模式：平时浏览 150/s，第 60 秒起升到 900/s（约容量的 1.8 倍）持续 180 秒
ha.mode=burst
ha.baseRps=150
ha.burstRps=900
ha.burstAtSec=60
ha.burstSec=180
ha.durationSec=360

[mall-gateway]
# 正式值显式写一遍：网关 3 秒响应超时
spring.cloud.gateway.server.webflux.httpclient.response-timeout=3s
