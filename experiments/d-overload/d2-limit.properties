# D2：网关对匿名路由（anonymous：商品详情、猜你喜欢、登录）按总量限流，单机令牌桶，超出的直接 429 + Retry-After
# 阈值按 D0 的拐点取八成；下面是按容量模型预估的值，跑完 D0 后用 -Set "mall-gateway:mall.gateway.route-limits.anonymous.permits-per-second=<实测值>" 覆盖
[mall-gateway]
mall.gateway.route-limits.anonymous.permits-per-second=380
mall.gateway.route-limits.anonymous.burst=380
