# 所有实验共用的服务启动参数（以 --key=value 命令行参数传入，优先级高于 application*.yml 与 Nacos）。
# 只加「观测用」和「把 demo 的演示节奏拨回正式参数」的项，不改任何保护手段——保护手段的差异只写在各实验的变体文件里。

[all]
# dev 的日志级别是 debug，压测时日志量会拖慢服务
logging.level.io.github.clarence404.mall=info
# Tomcat 线程指标（tomcat_threads_busy_threads 等）要打开 MBean 注册才有，默认关闭
server.tomcat.mbeanregistry.enabled=true
# 服务端与服务间调用的耗时直方图：Prometheus 才能算 P99（默认只有 800ms 这一个桶）
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true

[mall-app]
# demo profile 把下单熔断改成了按次数统计、3 次就起算（为了演示控制台几次点击就能看到熔断）；实验要对照的是正式参数，这里拨回 application.yml 的值
resilience4j.circuitbreaker.instances.inventory-reserve.sliding-window-type=TIME_BASED
resilience4j.circuitbreaker.instances.inventory-reserve.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory-reserve.minimum-number-of-calls=100
resilience4j.circuitbreaker.instances.inventory-reserve.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.inventory-reserve.permitted-number-of-calls-in-half-open-state=20
