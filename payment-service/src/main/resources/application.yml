# 每个服务的 application.yml 只留连接信息，业务配置放 Nacos；密钥（含渠道商户密钥）由 Kubernetes Secret 注入
spring:
  application:
    name: payment-service
  profiles:
    default: dev
  task:
    scheduling:                 # 定时任务线程池：默认只有 1 个线程，所有 @Scheduled 排队执行——一个带远程调用的兜底任务卡住，
      pool:                     # 每秒一次的 outbox 中继和指标刷新就跟着停。给 4 个线程，周期任务互不阻塞
        size: 4
      thread-name-prefix: sched-
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      data-source-properties:             # 传给 MySQL 驱动的连接属性（高性能实验 I）
        useLocalSessionState: true        # 驱动记住自己设过的自动提交、只读、隔离级别；默认每条写语句之前都要先问服务端一次「会话是不是只读」
        cachePrepStmts: true              # 缓存预编译语句在客户端的解析结果，同一条 SQL 不用每次重新解析
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048       # 默认只缓存 256 个字符以内的 SQL，订单的几条语句都超长
  cloud:
    loadbalancer:
      cache:
        ttl: 5s            # 实例列表缓存，默认 35 秒：下游实例注销后最长还会被调用 35 秒（高可用实验 C），缩到 5 秒
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        register-enabled: false   # 关掉自动注册：预热完成、就绪后由 RegisterWhenReady 注册
        port: ${server.port}      # 端口本由自动注册从 Web 服务器启动事件里填，关掉自动注册后要显式给，否则注册成 -1
      config:
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
  http:
    serviceclient:
      mall-app:                  # 组名即 Nacos 里的服务名，LoadBalancer 自动接入
        connect-timeout: 200ms
        read-timeout: 800ms

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5

server:
  port: 8080
  shutdown: graceful

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      slo:
        http.server.requests: 800ms      # 生成 le="0.8" 的桶，延迟 SLO 直接用它算
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mall:
  http-client:                # 服务间 HTTP 调用的连接池。HttpClient 5 默认每个下游实例 5 条、取连接最多等 3 分钟：
    max-connections-per-route: 100       # 下游一慢，调用全排在池子里，读超时管不到（高可用实验 A）。按舱壁许可数留余量
    max-connections-total: 200
    connection-request-timeout: 100ms    # 取不到连接 100ms 就失败，不排队
  id:
    worker-id: ${WORKER_ID:}   # 雪花 ID 机器号：Kubernetes 里不配，由 Pod 启动时向 Redis 租（WorkerIdLease）；配了就用配置的
  security:
    jwt:
      secret: ${JWT_SECRET}
  pay:
    mock:
      secret: ${PAY_MOCK_SECRET}
  rocketmq:
    enabled: true
    endpoints: ${ROCKETMQ_ENDPOINTS:localhost:8081}
    access-key: ${ROCKETMQ_ACCESS_KEY:}
    secret-key: ${ROCKETMQ_SECRET_KEY:}
    consumption-threads: 4   # 每个消费组的消费线程数（客户端不设时是 20）：只有退款 1 个消费组，4 个线程，不超过连接池（20）的一半
