# 本地：docker compose 起的 MySQL（mall_payment 库）与 Nacos，只用本地开发的占位密码
spring:
  data:
    redis:                      # docker compose 起的单机 Redis；本地显式配了机器号，用不到租约
      host: ${MALL_REDIS_HOST:localhost}
      port: ${MALL_REDIS_PORT:6379}
      password: mall_dev
  datasource:
    url: jdbc:mysql://${MALL_DB_HOST:localhost}:${MALL_DB_PORT:3306}/mall_payment?serverTimezone=Asia/Shanghai
    username: mall
    password: mall_dev
  config:
    import:
      - optional:nacos:mall-common.yaml?group=COMMON_GROUP
      - optional:nacos:payment-service.yaml

server:
  port: 8083

mall:
  id:
    worker-id: 21   # 本地只有一个实例；与 mall-app（1）、inventory-service（11）错开
  security:
    jwt:
      secret: dev-only-jwt-secret-change-me-0123456789   # 本地开发占位，非真实密钥
  pay:
    mock:
      secret: dev-only-mock-pay-secret

# 独立管理端口（业务端口 + 10000）：Prometheus 只从这里匿名抓 /actuator/prometheus，业务端口上它仍要登录（401）；
# 健康检查也随之挪到这个端口。管理端口只给同网段的监控访问，不经网关、不对外。用 MANAGEMENT_PORT 改端口
management:
  server:
    port: ${MANAGEMENT_PORT:18083}
