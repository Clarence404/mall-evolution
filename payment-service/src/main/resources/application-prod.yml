# 生产（Kubernetes）：支付库暂时和 mall 共用实例、账号隔离；密钥由 Secret 注入，不进 Nacos
spring:
  flyway:
    enabled: false              # 迁移由 Argo CD 的 PreSync Job 用有 DDL 权限的账号执行，应用账号只有 DML 权限
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/mall_payment
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:                      # 雪花机器号租约：与 mall-app 共用同一套 Sentinel（键带服务名，互不干扰）
      sentinel:
        master: mall-cache
        nodes: 10.0.1.21:26379,10.0.1.22:26379,10.0.1.11:26379
        password: ${REDIS_SENTINEL_PASSWORD}
      password: ${REDIS_PASSWORD}
      timeout: 200ms
  config:
    import:
      - optional:nacos:mall-common.yaml?group=COMMON_GROUP
      - nacos:payment-service.yaml
