# payment-service 保持 Deployment 滚动更新：改动以渠道接入为主、有渠道沙箱与对账兜底，发布频率低；
# 需要金丝雀时按 inventory-service.yaml 的写法换成 Rollout。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: mall
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: payment-service}
  template:
    metadata:
      labels: {app: payment-service}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: mall/payment-service:1.0.0
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 18080}]   # 健康检查与指标在管理端口
          envFrom: [{secretRef: {name: payment-service-secret}}]   # 渠道商户密钥只在这个 Secret 里，其他服务看不到
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: payment-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=mall,deployment.environment.name=prod
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4318
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 2Gi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "curl -s -X POST localhost:8080/internal/offline; sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: mall
spec:
  selector: {app: payment-service}
  ports: [{port: 80, targetPort: http}]   # 只暴露业务端口，管理端口不进 Service
