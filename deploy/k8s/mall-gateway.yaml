# 入口：Ingress → mall-gateway（Service）→ 按 Nacos 里的实例路由到 mall-app / payment-service
# 网关保持 Deployment 滚动更新：路由与限流规则走 Nacos 配置（Beta 推送），镜像本身很少变化。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-gateway
  namespace: mall
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: mall-gateway}
  template:
    metadata:
      labels: {app: mall-gateway}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: mall/mall-gateway:2.0.0   # 占位标签，由流水线写入镜像 digest
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 18080}]   # 健康检查与指标在管理端口
          envFrom: [{secretRef: {name: mall-gateway-secret}}]
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: mall-gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=mall,deployment.environment.name=prod
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4318
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {memory: 1Gi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]   # 网关前面是 Service + Ingress，摘除 Endpoint 后再停
---
apiVersion: v1
kind: Service
metadata:
  name: mall-gateway
  namespace: mall
spec:
  selector: {app: mall-gateway}
  ports: [{port: 80, targetPort: http}]   # 只暴露业务端口，管理端口不进 Service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mall-api
  namespace: mall
spec:
  ingressClassName: nginx
  rules:
    - host: api.mall.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mall-gateway
                port: {number: 80}
