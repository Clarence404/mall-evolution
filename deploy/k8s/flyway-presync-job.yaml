# 数据库变更：Argo CD 同步时先用 PreSync 钩子执行 Flyway，再更新各服务的镜像。三个有库的服务各一个 Job，各连自己的库。
# 用有 DDL 权限的账号执行；应用 Pod 上 spring.flyway.enabled=false，运行账号只有 DML 权限。
# 每次表变更都得让新旧代码都能跑（先扩后缩）；超过 5 分钟的大表 DDL 交给 gh-ost 在低峰单独执行，不放进这里。
# 镜像：flyway/flyway 的版本与应用内的 Flyway（Spring Boot 4.1.2 管理的 12.4.0）对齐，升级 Spring Boot 时一起改；
# 三个 copy-migrations 的应用镜像标签只是占位，发布流水线（release.yml）会把它们和各服务清单里的镜像一起改成同一次构建的 digest。
# 三个 Job 引用的 DDL 账号 Secret（mall-app-ddl-secret / inventory-service-ddl-secret / payment-service-ddl-secret）见 secrets.example.yaml。
apiVersion: batch/v1
kind: Job
metadata:
  name: mall-app-flyway
  namespace: mall
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: migrations
          emptyDir: {}
      initContainers:
        - name: copy-migrations              # 迁移脚本取自同一个应用镜像，版本与代码一致
          image: mall/mall-app:2.0.0
          command: ["sh", "-c", "cp -r /app/db/migration/. /flyway/sql/"]
          volumeMounts: [{name: migrations, mountPath: /flyway/sql}]
      containers:
        - name: flyway
          image: flyway/flyway:12.4.0
          args: ["-locations=filesystem:/flyway/sql", "-connectRetries=10", "migrate"]
          env:
            - name: FLYWAY_URL
              valueFrom: {secretKeyRef: {name: mall-app-ddl-secret, key: url}}
            - name: FLYWAY_USER
              valueFrom: {secretKeyRef: {name: mall-app-ddl-secret, key: username}}
            - name: FLYWAY_PASSWORD
              valueFrom: {secretKeyRef: {name: mall-app-ddl-secret, key: password}}
          volumeMounts: [{name: migrations, mountPath: /flyway/sql}]
---
