# 新服务先上 Kubernetes：每个服务一个 Deployment 加一个 Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: mall
spec:
  replicas: 3
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}     # 先起新的、就绪后再停旧的
  selector:
    matchLabels: {app: inventory-service}
  template:
    metadata:
      labels: {app: inventory-service}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: mall/inventory-service:1.4.0
          ports: [{containerPort: 8080}]
          envFrom: [{secretRef: {name: inventory-service-secret}}]
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 2Gi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 5
            failureThreshold: 24                         # 最多给 2 分钟启动
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "curl -s -X POST localhost:8080/internal/offline; sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: mall
spec:
  selector: {app: inventory-service}
  ports: [{port: 80, targetPort: 8080}]
