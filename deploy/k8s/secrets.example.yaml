# Secret 模板：只有键名，没有值。真实值由运维在集群里创建（或用 External Secrets / Sealed Secrets），不进仓库。
# 数据库密码这类密钥不进 Nacos，由 Secret 注入环境变量，取代阶段一的 EnvironmentFile。
# 没有 WORKER_ID：Pod 名每次发布都变，雪花机器号由各 Pod 启动时向 Redis 租（见 mall-common 的 WorkerIdLease）。
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-secret
  namespace: mall
type: Opaque
stringData:
  SPRING_PROFILES_ACTIVE: prod
  NACOS_ADDR: ""
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""
  NACOS_NAMESPACE: ""
  DB_HOST: ""
  DB_USERNAME: ""
  DB_PASSWORD: ""
  JWT_SECRET: ""
  REDIS_PASSWORD: ""              # 雪花机器号租约
  REDIS_SENTINEL_PASSWORD: ""
  ROCKETMQ_ENDPOINTS: ""
  ROCKETMQ_ACCESS_KEY: ""
  ROCKETMQ_SECRET_KEY: ""
---
