# Flyway PreSync Job 用的 DDL 账号（每个库一份）：应用 Pod 的运行账号只有 DML 权限
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-ddl-secret
  namespace: mall
type: Opaque
stringData:
  url: "jdbc:mysql://inventory-db:3306/mall_inventory"
  username: ""
  password: ""
