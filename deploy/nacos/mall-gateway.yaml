# Nacos：mall-gateway.yaml。限流阈值按压测结论调；改这里等同于一次发布，先 Beta 推给一个 Pod 观察 5 分钟再全量
spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            response-timeout: 3s
          routes:
            - id: order-place
              uri: lb://mall-app
              order: 10
              predicates:
                - Path=/api/orders
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1     # 每个用户每秒 1 次
                    redis-rate-limiter.burstCapacity: 3     # 允许连点 3 次的突发
                    key-resolver: "#{@userRouteKeyResolver}"
            # payment-notify / payment / anonymous / mall-app 兜底路由与 application.yml 相同，略
