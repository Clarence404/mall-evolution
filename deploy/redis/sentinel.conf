# 模板：${...} 由部署脚本用 envsubst 渲染后再下发，密码不进仓库
# sentinel.conf：两台 Redis 主机各一个，第三个放在一台应用主机上，凑够多数派
port 26379
sentinel monitor mall-cache 10.0.1.21 6379 2
sentinel auth-pass mall-cache ${REDIS_PASSWORD}
sentinel down-after-milliseconds mall-cache 5000
sentinel failover-timeout mall-cache 30000
sentinel parallel-syncs mall-cache 1
requirepass ${REDIS_SENTINEL_PASSWORD}
