# 用途：阶段二起自建 Redis（两台云主机一主一从 + 3 个 Sentinel）的配置模板，对应 application-prod.yml 里的 Sentinel 地址。
# 本地 docker compose 不用它（compose 里直接用命令行参数起一个单机 Redis）。
# 模板：${...} 由部署脚本用 envsubst 渲染后再下发，密码不进仓库
# redis.conf（主从一致）：Redis 里全是缓存，丢了可以从数据库重建
maxmemory 2gb
maxmemory-policy allkeys-lfu     # 全是缓存，按访问频率淘汰；LFU 还让 redis-cli --hotkeys 可用
save 900 1                       # 只开 RDB，重启后不至于全量回源
appendonly no
requirepass ${REDIS_PASSWORD}
masterauth ${REDIS_PASSWORD}
# 从节点（10.0.1.22）额外加：replicaof 10.0.1.21 6379
