# 生产环境：只放非敏感项，密钥由 Kubernetes Secret（mall-app-secret）以环境变量注入
spring:
  flyway:
    enabled: false              # 迁移由 Argo CD 的 PreSync Job 用有 DDL 权限的账号执行，应用账号只有 DML 权限
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/mall
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
  config:
    import:
      - optional:nacos:mall-common.yaml?group=COMMON_GROUP   # 各服务公共配置
      - nacos:mall-app.yaml                                  # 本服务配置，缺了启动失败
  data:
    redis:                      # 一主一从 + 3 个 Sentinel，Lettuce 向 Sentinel 询问当前主节点，切换后自动重连
      sentinel:
        master: mall-cache
        nodes: 10.0.1.21:26379,10.0.1.22:26379,10.0.1.11:26379
        password: ${REDIS_SENTINEL_PASSWORD}
      password: ${REDIS_PASSWORD}
      timeout: 200ms
      lettuce:
        pool:
          max-active: 32

springdoc:                # 生产关闭接口文档
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

mall:
  reconcile:                     # 每日凌晨 2 点从三个库的只读从库对账
    enabled: true
    mall: {url: "jdbc:mysql://${MALL_REPLICA_HOST}:3306/mall", username: "${RECONCILE_DB_USERNAME}", password: "${RECONCILE_DB_PASSWORD}"}
    inventory: {url: "jdbc:mysql://${INVENTORY_REPLICA_HOST}:3306/mall_inventory", username: "${RECONCILE_DB_USERNAME}", password: "${RECONCILE_DB_PASSWORD}"}
    payment: {url: "jdbc:mysql://${PAYMENT_REPLICA_HOST}:3306/mall_payment", username: "${RECONCILE_DB_USERNAME}", password: "${RECONCILE_DB_PASSWORD}"}

logging:
  level:
    root: info
