# 生产环境：只放非敏感项，密钥由 systemd 的 EnvironmentFile=/etc/mall-evolution/env 注入
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/mall
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30

springdoc:                # 生产关闭接口文档
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info
