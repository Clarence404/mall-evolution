# 本地：连 docker compose 起的 MySQL，只用本地开发的占位密码
# 个人覆盖项（中间件在别的机器上时的地址等）放 ./config/application-local.yml（已加入 .gitignore）：四个服务都一样，
# 激活 local profile、工作目录在仓库根目录时由 Spring Boot 按默认规则读到，这里不再单独 import
spring:
  datasource:
    url: jdbc:mysql://${MALL_DB_HOST:localhost}:${MALL_DB_PORT:3306}/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: mall
    password: mall_dev
  data:
    redis:                      # docker compose 起的单机 Redis
      host: ${MALL_REDIS_HOST:localhost}
      port: ${MALL_REDIS_PORT:6379}
      password: mall_dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed   # 本地额外加载演示数据
  config:
    import:
      - optional:nacos:mall-common.yaml?group=COMMON_GROUP
      - optional:nacos:mall-app.yaml

mall:
  id:
    worker-id: 1   # 本地只有一个实例
  security:
    jwt:
      secret: dev-only-jwt-secret-change-me-0123456789   # 本地开发占位，非真实密钥

logging:
  level:
    io.github.clarence404.mall: debug

# 独立管理端口（业务端口 + 10000）：Prometheus 只从这里匿名抓 /actuator/prometheus，业务端口上它仍要登录（401）；
# 健康检查也随之挪到这个端口。管理端口只给同网段的监控访问，不经网关、不对外。用 MANAGEMENT_PORT 改端口
management:
  server:
    port: ${MANAGEMENT_PORT:18080}
