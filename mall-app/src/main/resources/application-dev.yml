# 本地：连 docker compose 起的 MySQL，只用本地开发的占位密码
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: mall
    password: mall_dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed   # 本地额外加载演示数据
  config:
    import: optional:file:./application-local.yml   # 个人覆盖项，已加入 .gitignore

mall:
  id:
    worker-id: 1   # 本地只有一个实例
  security:
    jwt:
      secret: dev-only-jwt-secret-change-me-0123456789   # 本地开发占位，非真实密钥
  pay:
    mock:
      secret: dev-only-mock-pay-secret

logging:
  level:
    io.github.clarence404.mall: debug
