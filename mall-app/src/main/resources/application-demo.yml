# 演示用（demo profile）：叠加在 dev 之上，只调节奏，让演示控制台几分钟内能看到效果。
# docker compose --profile demo（dev,demo）、IDEA 运行配置（dev,local,demo）和 README 里的 java -jar 命令都会启用它；
# 生产不启用，而且 prod 与 demo 同时激活会直接启动失败（ProdDemoProfileGuard）。
# 连接地址（MySQL、Redis、Nacos、RocketMQ）不写在这里：compose 里由环境变量覆盖，本机运行用 dev 的默认值或 config/application-local.yml
mall:
  order:
    timeout-scan-interval: 20s   # 兜底扫描也跟着加快
    timeout-scan-after: 90s
  promo:
    normal-pay-timeout: 1m       # 下单 1 分钟未支付即关单（默认 15 分钟）
    activity-pay-timeout: 1m

# 熔断：按次数统计、3 次起算，几次慢调用就能看到熔断打开；打开 15 秒后半开，放 2 个探测请求
resilience4j:
  circuitbreaker:
    instances:
      inventory-reserve:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 3
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
