# 公共配置；环境差异放 application-{dev,test,prod}.yml，密钥一律走环境变量
spring:
  application:
    name: mall-app
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  data:
    redis:
      timeout: 200ms            # 缓存慢了宁可回源，不让请求卡在 Redis 上
      connect-timeout: 1s
      lettuce:
        pool:
          max-active: 32
  mvc:
    apiversion:                 # 版本从请求头 API-Version 读，不带请求头按 1.0 处理
      default: 1.0
      use:
        header: API-Version

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics   # 缓存命中率等 Micrometer 指标
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mall:
  id:
    worker-id: ${WORKER_ID:}   # 雪花 ID 机器号：两台生产机分别是 1 和 2；不给默认值，没配就启动失败
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 30m
      refresh-token-ttl: 14d
  pay:
    mock:
      secret: ${PAY_MOCK_SECRET}
  order:
    pay-timeout: 15m             # 超时 15 分钟未支付取消：下单时写一条 order-timeout 定时消息
    timeout-scan-interval: 10m   # 扫描降级为兜底：每 10 分钟一次
    timeout-scan-after: 20m      # 只处理创建超过 20 分钟仍待支付的订单
  rocketmq:
    enabled: true
    endpoints: ${ROCKETMQ_ENDPOINTS:localhost:8081}   # Proxy 的 gRPC 接入点
    access-key: ${ROCKETMQ_ACCESS_KEY:}
    secret-key: ${ROCKETMQ_SECRET_KEY:}
    request-timeout: 1s   # 同步发送等 Broker 确认的上限；中继在事务外发送，超时只卡中继线程，不占数据库连接
