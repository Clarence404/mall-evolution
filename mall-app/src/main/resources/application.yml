# 公共配置；环境差异放 application-{dev,test,prod}.yml，密钥一律走环境变量
spring:
  application:
    name: mall-app
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  mvc:
    apiversion:                 # 版本从请求头 API-Version 读，不带请求头按 1.0 处理
      default: 1.0
      use:
        header: API-Version

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mall:
  id:
    worker-id: ${WORKER_ID:}   # 雪花 ID 机器号：两台生产机分别是 1 和 2；不给默认值，没配就启动失败
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 30m
      refresh-token-ttl: 14d
  pay:
    mock:
      secret: ${PAY_MOCK_SECRET}
  order:
    pay-timeout: 15m             # 超时 15 分钟未支付取消
    timeout-scan-interval: 60s   # 阶段一每分钟扫一次
