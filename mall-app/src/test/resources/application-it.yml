# 集成测试：数据源由 Testcontainers 的 @ServiceConnection 提供
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  cloud:                  # 测试不连 Nacos
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false
mall:
  id:
    worker-id: 9
  rocketmq:
    enabled: false   # 测试不连 Broker：业务事务里照常写 t_outbox
  security:
    jwt:
      secret: test-only-jwt-secret-0123456789abcdef
